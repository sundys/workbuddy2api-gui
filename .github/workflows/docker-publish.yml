# WorkBuddy2API Web GUI —— 构建多架构镜像并发布到 GitHub Container Registry。
#
# 触发条件：
#   · 推送 master 分支（Dockerfile / 前端 / 后端 / go.mod 变更时才构建）
#   · 推送 v* 形式的 tag（如 v1.2.3），产出正式版本号镜像
#   · 手动触发（Actions 页面 → Run workflow）
#
# 产物（均为 linux/amd64 + linux/arm64 双架构）：
#   ghcr.io/<owner>/<repo>:latest            ← 默认分支最新
#   ghcr.io/<owner>/<repo>:1.2.3             ← tag 时，完整版本号
#   ghcr.io/<owner>/<repo>:1.2               ← tag 时，major.minor
#   ghcr.io/<owner>/<repo>:sha-<短哈希>      ← 每次构建，用于精确回滚
#
# ghcr 镜像名必须全小写，仓库名含大写字母时下面会自动转小写。

name: docker-publish

on:
  push:
    branches: [master]
    tags: ['v*']
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'cmd/**'
      - 'internal/**'
      - 'web/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # 推送 ghcr 需要的写权限
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 计算镜像名（ghcr 要求全小写）
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: 生成镜像标签与标签（OCI 规范）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=workbuddy2api-gui
            org.opencontainers.image.description=workbuddy2api 网关的 Web 管理面板
            org.opencontainers.image.licenses=Apache-2.0

      - name: 安装 QEMU（多架构模拟）
        uses: docker/setup-qemu-action@v3

      - name: 安装 buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            # 构建期注入版本号（main.version），与镜像标签保持一致；
            # 非 tag 构建时 meta.version 为空，回退用提交哈希。
            VERSION=${{ steps.meta.outputs.version || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false   # 关闭后 manifest 列表更干净，旧版 docker pull 更友好

      - name: 打印产物清单
        run: |
          echo "本次构建的镜像标签："
          echo "${{ steps.meta.outputs.tags }}" | tr '\n' ' '
          echo
          echo "架构：linux/amd64, linux/arm64"
