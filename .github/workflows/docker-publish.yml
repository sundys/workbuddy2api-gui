# WorkBuddy2API Web GUI —— 构建多架构镜像并发布到 GitHub Container Registry，
# 并在打标签时自动创建 GitHub Release（无需本地 gh 命令）。
#
# 触发条件：
#   · 推送 master 分支（Dockerfile / 前端 / 后端 / go.mod 变更时才构建）
#   · 推送版本标签（如 1.2.3 或 v1.2.3），产出正式版本号镜像 + 自动发布 Release
#   · 手动触发（Actions 页面 → Run workflow）
#
# 产物（均为 linux/amd64 + linux/arm64 双架构）：
#   ghcr.io/<owner>/<repo>:latest            ← 默认分支最新
#   ghcr.io/<owner>/<repo>:1.2.3             ← tag 时，完整版本号
#   ghcr.io/<owner>/<repo>:1.2               ← tag 时，major.minor
#   ghcr.io/<owner>/<repo>:sha-<短哈希>      ← 每次构建，用于精确回滚
#
# 发版方式（不再需要 gh 命令）：
#   git tag 1.2.3 && git push origin 1.2.3
#
# ghcr 镜像名必须全小写，仓库名含大写字母时下面会自动转小写。

name: docker-publish

on:
  push:
    branches: [master]
    tags: ['v*', '[0-9]*']   # 1.2.3 与 v1.2.3 两种风格都接受
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'cmd/**'
      - 'internal/**'
      - 'web/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # 推送 ghcr 需要的写权限
    outputs:
      version: ${{ steps.version.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 计算镜像名（ghcr 要求全小写）
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: 生成镜像标签与标签（OCI 规范）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=workbuddy2api-gui
            org.opencontainers.image.description=workbuddy2api 网关的 Web 管理面板
            org.opencontainers.image.licenses=Apache-2.0

      - name: 计算 VERSION（复用本地 build-version.sh 的同一套规则）
        id: version
        run: |
          chmod +x build-version.sh
          echo "version=$(./build-version.sh -p)" >> "$GITHUB_OUTPUT"

      - name: 安装 QEMU（多架构模拟）
        uses: docker/setup-qemu-action@v3

      - name: 安装 buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送（amd64 + arm64）
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            # 构建期注入版本号（main.version）：tag 构建时与镜像标签一致，
            # 无 tag 时回退为 dev。与本地 ./build-version.sh 用同一套 git describe 规则。
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false   # 关闭后 manifest 列表更干净，旧版 docker pull 更友好

      # 导出离线镜像包（docker save 格式，单架构一份 tar）。
      # buildx 的多架构构建无法一次输出多个 docker tar，所以按架构各构建导出一次；
      # 复用 build cache，第二次导出很快。产物供 release job 上传为附件。
      - name: 导出离线镜像包（amd64）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          tags: ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}-amd64
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          provenance: false
          outputs: type=docker,dest=workbuddy2api-gui-${{ steps.version.outputs.version }}-amd64.tar

      - name: 导出离线镜像包（arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: false
          tags: ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}-arm64
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          provenance: false
          outputs: type=docker,dest=workbuddy2api-gui-${{ steps.version.outputs.version }}-arm64.tar

      - name: 上传离线镜像包（供 release job 下载）
        uses: actions/upload-artifact@v4
        with:
          name: offline-images-${{ github.run_id }}
          path: |
            workbuddy2api-gui-*.tar
          if-no-files-found: error
          retention-days: 7

      - name: 记录镜像 digest
        id: digest
        run: echo "digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - name: 打印产物清单
        run: |
          echo "本次构建的镜像标签："
          echo "${{ steps.meta.outputs.tags }}" | tr '\n' ' '
          echo
          echo "架构：linux/amd64, linux/arm64"

  # ── 发布 GitHub Release（仅在打版本标签时运行）──────────────────
  # 需要写权限：contents: write 才能创建 Release。
  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write   # 创建 / 更新 Release
    steps:
      - name: 检出代码（含完整历史，用于生成更新记录）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 生成发布说明
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # 取上一个标签（按创建时间倒序的第二个），没有则列出全部提交。
          PREV=$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -n 1 || true)
          if [[ -n "$PREV" ]]; then
            echo "上一版本标签：$PREV"
            RANGE="${PREV}..HEAD"
          else
            echo "未找到更早的标签，列出全部提交"
            RANGE=""
          fi

          # 提交记录去掉 merge 提交，一行一条。
          if [[ -n "$RANGE" ]]; then
            LOG=$(git log --no-merges --pretty=format:"- %s" "$RANGE")
          else
            LOG=$(git log --no-merges --pretty=format:"- %s")
          fi
          [[ -z "$LOG" ]] && LOG="-（未采集到提交记录）"

          VERSION="${{ needs.build.outputs.version }}"
          TAGS="${{ needs.build.outputs.tags }}"
          DIGEST="${{ needs.build.outputs.digest }}"

          {
            echo "body<<RELEASE_NOTES_EOF"
            echo "## 📦 Docker 镜像"
            echo
            echo "\`\`\`"
            echo "$TAGS" | sed 's/^/docker pull /'
            echo "\`\`\`"
            echo
            echo "- 架构：\`linux/amd64\`、\`linux/arm64\`"
            echo "- 镜像 digest：\`${DIGEST}\`（内容固定指纹，跨架构引用同一份）"
            echo "- 二进制内置版本号：\`${VERSION}\`"
            echo
            echo "## 🚀 升级 / 首次部署"
            echo
            echo '```bash'
            echo "# 拉取本版本镜像（公开镜像无需登录）"
            echo "docker pull ghcr.io/${GITHUB_REPOSITORY,,}:${VERSION}"
            echo
            echo "# 已部署：配置都在数据卷里，升级不丢数据"
            echo "docker compose pull && docker compose up -d"
            echo '```'
            echo
            echo "> 首次部署请先看 README 的「快速开始」与「配置持久化与数据备份」，"
            echo "> 确认 auths 目录、网关 config.json 与面板 data 目录已挂载到宿主机。"
            echo
            echo "## 📥 离线镜像包（无网 / 内网部署）"
            echo
            echo "本 Release 附带两个架构的 docker 镜像 tar，无法访问 ghcr 时可直接导入："
            echo
            echo '```bash'
            echo "docker load -i workbuddy2api-gui-${VERSION}-amd64.tar   # x86_64 服务器"
            echo "docker load -i workbuddy2api-gui-${VERSION}-arm64.tar   # ARM（如树莓派 / 鲲鹏）"
            echo
            echo "# 导入后镜像名带架构后缀，按需重打标签再用 compose 启动："
            echo "docker tag ghcr.io/\${GITHUB_REPOSITORY,,}:${VERSION}-amd64 ghcr.io/\${GITHUB_REPOSITORY,,}:${VERSION}"
            echo '```'
            echo
            echo "> 导入的镜像是单架构的，不要跨架构启动；两台不同架构的机器分别导入对应文件。"
            echo
            echo "## 📝 更新内容"
            echo
            echo "$LOG"
            echo
            echo "---"
            echo "完整改动历史：[\`$(git rev-parse --short HEAD)\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 下载离线镜像包（从 build job 的 artifact）
        uses: actions/download-artifact@v4
        with:
          name: offline-images-${{ github.run_id }}
          path: ./offline
        continue-on-error: true

      - name: 校验离线镜像包
        id: assets
        run: |
          if [[ -d ./offline ]]; then
            # download-artifact v4 会把 artifact 里的文件平铺到 path 根目录。
            mv ./offline/*.tar ./ 2>/dev/null || true
          fi
          echo "找到的离线镜像包："
          ls -1 workbuddy2api-gui-*.tar 2>/dev/null || true
          # 拼成软props接受的逗号分隔列表（含空格的路径需要整体引号）。
          FILES=""
          for f in workbuddy2api-gui-*.tar; do
            [[ -f "$f" ]] || continue
            if [[ -z "$FILES" ]]; then FILES="$f"; else FILES="$FILES,$f"; fi
          done
          echo "assets=$FILES" >> "$GITHUB_OUTPUT"
          [[ -z "$FILES" ]] && echo "⚠ 未找到 tar（附件将为空，见上面日志）" || echo "✓ 将上传 $FILES"

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # tag 名即版本名；标签已存在，此处只发布 Release，不会再建标签。
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          # 离线镜像包：内网/无网环境可用 docker load 直接导入。
          files: ${{ steps.assets.outputs.assets }}
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
